<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open When</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Caveat:wght@500;600&display=swap">
<style>
:root{
  --bg:#f1ece4; --ink:#2b2433; --muted:#6f6577;
  --env:#fffdf9; --env-edge:#e2d8ca; --flap:#f4ece0;
  --seal:#a8465a;
  --paper:#fffef9; --paper-ink:#2b2433; --scrim:rgba(30,22,38,.5);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17131d; --ink:#efe8f2; --muted:#a498ad;
    --env:#262030; --env-edge:#3a3246; --flap:#2e2739;
    --seal:#c75a72;
    --paper:#f7f1e6; --paper-ink:#2b2433; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:44px 22px 64px}
h1{font-weight:500;font-size:2.1rem;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 34px;font-size:1.05rem;max-width:34ch}
.list{display:grid;gap:18px}

.env{position:relative;display:block;width:100%;height:132px;padding:0;border:0;background:none;
  text-align:left;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.env .body{position:absolute;inset:0;background:var(--env);border:1px solid var(--env-edge);border-radius:6px;
  box-shadow:0 1px 0 var(--env-edge),0 10px 22px -14px rgba(43,36,51,.45);transition:transform .25s}
.env .flap{position:absolute;left:0;right:0;top:0;height:74px;background:var(--flap);
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0;
  transform-origin:top;transition:transform .35s ease}
.env .flap::after{content:"";position:absolute;inset:0;background:var(--env-edge);
  clip-path:polygon(0 0,100% 0,100% 1.5px,50% calc(100% + 1.5px),0 1.5px);opacity:.9}
.env .seal{position:absolute;left:50%;top:60px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:var(--seal);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.env .label{position:absolute;left:18px;right:18px;bottom:14px;font-size:1.15rem;font-style:italic;text-align:center}
.env:active .body{transform:scale(.985)}
.env:focus-visible{outline:2px solid var(--seal);outline-offset:4px;border-radius:8px}

.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--paper);color:var(--paper-ink);
  border-radius:16px 16px 0 0;padding:30px 26px calc(28px + env(safe-area-inset-bottom,0px));
  animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-weight:500;font-size:1.35rem;margin:0 0 16px;font-style:italic}
.note{font-family:"Caveat","Bradley Hand","Segoe Script",cursive;font-size:1.5rem;line-height:1.4;
  white-space:pre-line;margin:0 0 22px;font-weight:500}
.photo{display:none;width:100%;max-height:340px;object-fit:cover;border-radius:6px;margin:0 0 20px;
  border:6px solid #fff;box-shadow:0 6px 18px -8px rgba(43,36,51,.5)}
.photo.on{display:block}
.sign{font-family:"Caveat","Bradley Hand","Segoe Script",cursive;font-size:2rem;line-height:1.2;
  text-align:right;margin:0 0 26px;font-weight:600;white-space:pre-line}
.close{font:inherit;font-size:1rem;background:none;border:1px solid currentColor;color:inherit;
  border-radius:999px;padding:9px 20px;cursor:pointer}
.close:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.env .flap,.env .body{transition:none}}
</style>
</head>
<body>
<main>
  <h1 id="title">For you</h1>
  <p class="sub" id="sub">Keep this page open on your phone. Tap an envelope when it’s time.</p>
  <div class="list" id="list"></div>
</main>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="nTitle">
  <div class="sheet">
    <h2 id="nTitle"></h2>
    <p class="note" id="nBody"></p>
    <img class="photo" id="nPhoto" alt="">
    <p class="sign" id="nSign"></p>
    <button class="close" id="close">Close</button>
  </div>
</div>

<script>
// ✏️ EDIT HERE: your name for her, the intro line, and each envelope's label + note.
const FOR_NAME = "Lalove";
// 📷 Photo shown at the bottom of every note. Put the image file in the same folder as this
// page and write its name here (e.g. "us.jpg"). Leave "" for no photo.
const PHOTO = "";
// ✍️ Signature shown at the bottom of every note. Use \n for a new line.
const SIGNATURE = "With love,\nPi";
const INTRO = "Keep this page open on your phone. Tap an envelope when it’s time.";

const LETTERS = [
  { label: "Open in the meantime",
    note: "Dear Lalove,\n\nIt just feels so fast that we’ve been together for 31 months, and I can’t believe that time can go that fast. I still remember the times when we’re starting out, through all the ups and down, through every gastos that made us smile and our bellies full, through all the fights and arguments that we had. I am so proud to see the person you’ve become through all these times I’ve been with you, I can’t forget how much you warmed my heart by staying by my side through all the ups and downs, especially when you yourself is also not in good spirits, you never seize to lift up my mood when I need you the most. You’ve brought, taught, and shown me what it means to love a person, make a person’s day, and be the source of positivity that everyone needs.\n\nI know you’ve been through a lot since we’ve met, especially in school, family, and even me. From how you have been juggling school works with personal life with all the sleepless and restless night with your readings, recits, reviews, and papers, along with your problems at home that you’ve been keeping to yourself most of the time, and also your struggles in loving and staying with me. I’ve seen you handle these things very well, that even all the difficult things that school made you do, you’ve managed to stay positive and get through each and every reading, quiz, and recits that they have given you, to being the light in your home that everyone runs to when things go rough, and being my everything even when it feels hard on you from time to time. You keep pushing hard on everything that life throws at you so far.\n\nAs you take your time for your retreat, I am offering up my prayers for your peace of mind, health, and strength you need for the upcoming tasks that God has yet to give. My prayer for you during your retreat is that you have the patience that can withstand everyone, strength to take on the challenges that life has to give, wisdom to solve every task that is yet to come, health to help you continue pursuing your dreams without any burdens, and love to be received to help you continue doing what you want and where you want to be." },

  // ➕ NEW ENVELOPE: copy the 2 lines below, remove the // at the start of each,
  // and paste them right ABOVE this comment. Then change the label and note.
  // (Keep the comma at the end.)
  // Optional: add  photo: "other.jpg",  inside a letter to use a different photo for it.
  //
  // { label: "Open when you feel tired",
  //   note: "Write your note here." },
];

const $ = id => document.getElementById(id);

$("title").textContent = "For " + FOR_NAME;
$("sub").textContent = INTRO;
document.title = "Open When · " + FOR_NAME;

let lastBtn = null;
LETTERS.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "env";
  b.innerHTML = '<span class="body"></span><span class="flap"></span><span class="seal"></span><span class="label"></span>';
  b.querySelector(".label").textContent = l.label;
  b.addEventListener("click", () => {
    lastBtn = b;
    $("nTitle").textContent = l.label;
    $("nBody").textContent = l.note;
    const src = l.photo || PHOTO;
    $("nPhoto").classList.toggle("on", !!src);
    if (src) $("nPhoto").src = src; else $("nPhoto").removeAttribute("src");
    $("nSign").textContent = SIGNATURE;
    $("scrim").classList.add("on");
    $("close").focus();
  });
  $("list").appendChild(b);
});

function closeNote(){ $("scrim").classList.remove("on"); if (lastBtn) lastBtn.focus(); }
$("close").addEventListener("click", closeNote);
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeNote(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeNote(); });
</script>
</body>
</html>
